    font-family: 'Courier New', monospace; font-weight: 700;

    touch-action: manipulation;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);

  body { display: flex; flex-direction: column; }
  .hdr { background: #111; border-bottom: 2px solid #333; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #888; flex-shrink: 0; gap: 8px; }
  .hdr .stats { display: flex; gap: 10px; }
  .hdr .stat b { color: #fff; font-size: 13px; }
  .hdr .ok b { color: #00ff66; }
  .hdr .bad b { color: #ff2244; }
  .hdr-btn { background: #222; color: #ccc; border: 1px solid #444; padding: 4px 8px; font-family: inherit; font-size: 10px; cursor: pointer; font-weight: 700; }
  .hdr-btn:active { background: #444; }
  .mode-bar { background: #0d0d0d; border-bottom: 1px solid #222; padding: 4px; display: flex; flex-shrink: 0; }
  .mode-btn { flex: 1; background: transparent; color: #666; border: 1px solid #222; padding: 8px 4px; font-family: inherit; font-size: 11px; font-weight: 700; cursor: pointer; margin: 0 2px; }
  .mode-btn.active { background: #00ff66; color: #000; border-color: #00ff66; }
  .main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px; transition: background 0.05s; position: relative; overflow: hidden; }
  .main.ok { background: #00bb44; }
  .main.bad { background: #cc0022; }
  .main.idle { background: #1a1a1a; }
  .main.wait { background: #1a1a1a; }
  .verdict { font-size: 22vw; line-height: 0.85; font-weight: 900; text-shadow: 0 4px 0 rgba(0,0,0,0.3); letter-spacing: -0.05em; }
  .verdict.small { font-size: 14vw; }
  .verdict.tiny { font-size: 9vw; }
  .city { font-size: 7vw; margin-top: 8px; text-align: center; line-height: 1; word-break: break-word; max-width: 100%; }
  .meta { font-size: 3.5vw; margin-top: 6px; opacity: 0.85; text-align: center; padding: 0 8px; }
  .awb { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: 0.7; font-family: monospace; }
  .ts { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 11px; opacity: 0.6; }
  .cam-wrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 50; display: none; flex-direction: column; }
  .cam-wrap.open { display: flex; }
  #cam-video { flex: 1; width: 100%; object-fit: cover; background: #000; }
  .cam-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 70px; pointer-events: none; display: flex; justify-content: center; align-items: center; }
  .cam-frame { width: 85%; height: 25%; border: 3px solid #00ff66; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); position: relative; }
  .cam-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: #ff2244; box-shadow: 0 0 8px #ff2244; animation: scanline 1.5s linear infinite; }
  @keyframes scanline { 0%,100% { top: 10%; } 50% { top: 90%; } }
  .cam-hint { position: absolute; top: 20px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); padding: 0 20px; }
  .cam-controls { background: #111; padding: 10px; display: flex; gap: 6px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
  .cam-controls button { flex: 1; background: #333; color: #fff; border: 1px solid #555; padding: 12px 6px; font-family: inherit; font-weight: 700; font-size: 12px; min-width: 70px; }
  .cam-controls button.primary { background: #ff2244; border-color: #ff2244; }
  .cam-status { color: #ccc; font-size: 11px; padding: 4px 8px; flex-basis: 100%; text-align: center; background: #000; border-radius: 4px; }
  .input-wrap { background: #111; border-top: 2px solid #333; padding: 8px; display: flex; gap: 6px; flex-shrink: 0; align-items: stretch; }
  #scan-input { flex: 1; background: #000; color: #00ff66; border: 2px solid #00ff66; padding: 12px; font-family: monospace; font-size: 16px; font-weight: 700; outline: none; min-width: 0; }
  .btn-icon { background: #333; color: #fff; border: 2px solid #555; padding: 0 12px; font-family: inherit; font-weight: 700; font-size: 13px; cursor: pointer; flex-shrink: 0; }
  .btn-icon.go { background: #00ff66; color: #000; border-color: #00ff66; }
  .btn-icon.cam { background: #ffaa00; color: #000; border-color: #ffaa00; }
  .btn-icon:active { opacity: 0.7; }
  .label-hint { background: #0a0a0a; color: #666; font-size: 10px; padding: 4px 10px; text-align: center; border-top: 1px solid #1a1a1a; }
  .panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #0a0a0a; z-index: 100; padding: 14px; padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: calc(14px + env(safe-area-inset-bottom)); display: none; flex-direction: column; overflow-y: auto; }
  .panel.open { display: flex; }
  .panel h2 { font-size: 18px; margin-bottom: 12px; color: #00ff66; }
  .panel h3 { font-size: 13px; margin-top: 14px; margin-bottom: 6px; color: #888; text-transform: uppercase; }
  .panel label { display: block; margin: 8px 0; font-size: 13px; color: #ccc; }
  .panel input[type="checkbox"] { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }
  .panel input[type="text"], .panel select { width: 100%; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 13px; margin-bottom: 8px; }
  .panel .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .panel button { background: #00ff66; color: #000; border: none; padding: 12px 18px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1; min-width: 100px; }
  .panel button.danger { background: #ff2244; color: #fff; }
  .panel button.secondary { background: #333; color: #fff; }
  .panel .log { background: #000; padding: 8px; font-size: 11px; color: #999; max-height: 200px; overflow-y: auto; border: 1px solid #222; margin-top: 8px; font-family: monospace; }
  .log-entry { padding: 2px 0; border-bottom: 1px dashed #222; word-break: break-all; }
  .log-entry.bad { color: #ff6677; }
  .log-entry.ok { color: #66ff99; }
  .log-entry.info { color: #66aaff; }
  .info-box { background: #1a1a1a; border-left: 3px solid #00ff66; padding: 10px; margin: 8px 0; font-size: 11px; color: #aaa; line-height: 1.4; }

  .info-box.bad { border-left-color: #ff2244; }
  .badge { display: inline-block; padding: 2px 6px; font-size: 10px; background: #333; color: #fff; border-radius: 2px; margin-left: 4px; }
  .badge.r1 { background: #00ff66; color: #000; }
  .badge.r2 { background: #ffaa00; color: #000; }
  .badge.r3 { background: #ff2244; color: #fff; }
  .ac-wrap { position: relative; }
  .ac-list { position: absolute; bottom: 100%; left: 0; right: 0; background: #000; border: 2px solid #00ff66; border-bottom: none; max-height: 200px; overflow-y: auto; display: none; z-index: 10; }
  .ac-list.open { display: block; }
  .ac-item { padding: 10px; color: #fff; font-size: 14px; border-bottom: 1px solid #222; cursor: pointer; }
  .ac-item:active { background: #00ff66; color: #000; }
  .ac-item small { display: block; color: #888; font-size: 10px; margin-top: 2px; }

<div class="hdr">

<div class="mode-bar">

<div class="main idle" id="main">

  <div class="city" id="city"></div>
  <div class="meta" id="meta"></div>
  <div class="ts" id="ts"></div>
</div>

<div class="ac-wrap">
  <div class="ac-list" id="ac-list"></div>
  <div class="input-wrap">
    <input id="scan-input" type="text" autocomplete="off" placeholder="AWB 13 cifre sau scan...">

    <button class="btn-icon cam" id="btn-cam">CAM</button>
  </div>
</div>

<div class="label-hint" id="label-hint">Mod: AWB + API</div>

<div class="cam-wrap" id="cam-wrap">
  <video id="cam-video" autoplay muted playsinline></video>
  <div class="cam-overlay">
    <div class="cam-frame"><div class="cam-line"></div></div>
    <div class="cam-hint">Aliniaza barcode in cadru</div>
  </div>
  <div class="cam-controls">
    <span class="cam-status" id="cam-status">Pornesc...</span>
    <button id="btn-cam-torch">FLASH</button>
    <button id="btn-cam-switch">SWITCH</button>
    <button id="btn-cam-close" class="primary">INCHIDE</button>
  </div>
</div>

<div class="panel" id="panel">
  <h2>SETARI SORTARE FAN R1</h2>
  <div class="info-box" id="env-info"><b>Mediu detectat:</b> <span id="env-text">verificare...</span></div>

  <h3>Mod operare</h3>
  <label><input type="checkbox" id="opt-sound" checked> Sunet pornit</label>
  <label><input type="checkbox" id="opt-vibrate" checked> Vibratie pornita</label>
  <label><input type="checkbox" id="opt-continuous"> Camera scan continuu</label>

  <h3>Clasificare</h3>
  <label>Ce conteaza ca <b>OK</b> (verde):</label>

  <label><input type="checkbox" id="opt-r2"> <span class="badge r2">R2</span> Sortare 2 (Cluj)</label>
  <label><input type="checkbox" id="opt-r3"> <span class="badge r3">R3</span> Sortare 3 (Cluj-Napoca)</label>

  <h3>API FAN</h3>
  <button id="btn-test-api" class="secondary" style="margin-bottom:8px;">TEST API (AWB demo)</button>
  <button id="btn-test-camera" class="secondary" style="margin-bottom:8px;">TEST CAMERA (diagnostic)</button>
  <label>Username:</label><input type="text" id="opt-user" value="clienttest">
  <label>Password:</label><input type="text" id="opt-pass" value="testing">
  <label>Client ID:</label><input type="text" id="opt-cid" value="7032158">

  <h3>Log evenimente</h3>
  <div class="log" id="log"></div>

  <h3>Actiuni</h3>
  <div class="row">
    <button id="btn-export">EXPORT CSV</button>
    <button class="secondary" id="btn-reset-stats">RESET STATS</button>
    <button class="danger" id="btn-clear-all">STERGE TOT</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <button class="danger" id="btn-force-reload">FORCE RELOAD (curata cache)</button>
  </div>
  <div class="row" style="margin-top:14px;"><button id="btn-close">INCHIDE SETARI</button></div>
  <p style="margin-top:14px; font-size:11px; color:#555; text-align:center;">DB: <span id="db-count">-</span> localitati - v2.0 PWA</p>
</div>

  : (location.protocol === 'http:' ? '/api/fan' : 'https://www.selfawb.ro');

  mode: 'awb',

  log: [],

function normalize(s) {
  if (!s) return '';
  return s.toString().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().replace(/[\s\-\.\,\/]+/g, '').trim();
}
function extractAwb(raw) {
  const digits = raw.replace(/\D/g, '');
  if (digits.length < 13) return null;
  return digits.substring(0, 13);
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function beep(type) {
  if (!state.opts.sound) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  const now = ctx.currentTime;
  if (type === 'ok') {
    o.frequency.setValueAtTime(800, now);
    o.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
    o.start(now); o.stop(now + 0.13);
  } else if (type === 'bad') {
    o.type = 'square';
    o.frequency.setValueAtTime(180, now);
    g.gain.setValueAtTime(0.35, now);
    g.gain.setValueAtTime(0, now + 0.18);
    g.gain.setValueAtTime(0.35, now + 0.25);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    o.start(now); o.stop(now + 0.55);
  } else if (type === 'wait') {
    o.frequency.setValueAtTime(500, now);
    g.gain.setValueAtTime(0.15, now);
    g.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
    o.start(now); o.stop(now + 0.06);
  }
}
function vibrate(p) { if (state.opts.vibrate && navigator.vibrate) navigator.vibrate(p); }

const $ = id => document.getElementById(id);
const main = $('main'), verdict = $('verdict'), cityEl = $('city'), metaEl = $('meta');
const awbEl = $('awb-display'), tsEl = $('ts'), input = $('scan-input');

function showIdle() {
  main.className = 'main idle';
  verdict.textContent = 'SCAN';
  verdict.classList.remove('small','tiny');
  cityEl.textContent = ''; metaEl.textContent = '';
  awbEl.textContent = ''; tsEl.textContent = '';
}
function showWait(awb, msg) {
  main.className = 'main wait';
  verdict.textContent = '...';
  verdict.classList.remove('small','tiny');
  cityEl.textContent = ''; metaEl.textContent = msg || 'Lucreaza...';
  awbEl.textContent = awb || ''; tsEl.textContent = '';
  beep('wait');
}
function fitVerdict(t) {
  verdict.classList.remove('small','tiny');
  if (t && t.length > 6) verdict.classList.add('small');
  if (t && t.length > 12) verdict.classList.add('tiny');
}
function showResult(ok, awb, city, sortClass, agentie, judet, source) {
  const allowed = (sortClass === 'R1' && state.opts.r1) ||
                  (sortClass === 'R2' && state.opts.r2) ||
                  (sortClass === 'R3' && state.opts.r3);
  const isOk = ok && allowed;
  main.className = 'main ' + (isOk ? 'ok' : 'bad');
  verdict.textContent = isOk ? 'OK' : 'NU';
  fitVerdict(verdict.textContent);
  cityEl.textContent = city || '?';
  let metaStr = '';
  if (sortClass) metaStr += sortClass + ' - ';
  if (agentie && agentie !== city) metaStr += agentie + ' - ';
  if (judet) metaStr += judet;
  if (source) metaStr += ' [' + source + ']';
  metaEl.textContent = metaStr;
  awbEl.textContent = awb || '';
  tsEl.textContent = new Date().toLocaleTimeString('ro-RO');
  if (isOk) { state.ok++; beep('ok'); vibrate(80); }
  else { state.bad++; beep('bad'); vibrate([150, 80, 150]); }
  state.total++;
  updateCounters();
  logEntry(isOk, awb || '', city, sortClass, agentie);
  saveState();
}
function showError(awb, reason) {
  main.className = 'main bad';
  verdict.textContent = 'NU'; fitVerdict('NU');
  cityEl.textContent = '???'; metaEl.textContent = reason || 'Necunoscut';
  awbEl.textContent = awb || '';
  tsEl.textContent = new Date().toLocaleTimeString('ro-RO');
  state.bad++; state.total++;
  beep('bad'); vibrate([200, 100, 200]);
  updateCounters();
  logEntry(false, awb || '', '???', 'X', reason);
  saveState();
}
function updateCounters() {
  $('cnt-ok').textContent = state.ok;
  $('cnt-bad').textContent = state.bad;
  $('cnt-total').textContent = state.total;
}

function logEntry(ok, awb, city, sortClass, extra) {
  const t = new Date().toLocaleTimeString('ro-RO');
  state.log.unshift({ t, ok, awb, city, sortClass, extra });
  if (state.log.length > 100) state.log = state.log.slice(0, 100);
  renderLog();
}
function logInfo(msg) {
  const t = new Date().toLocaleTimeString('ro-RO');
  state.log.unshift({ t, info: true, msg });
  if (state.log.length > 100) state.log = state.log.slice(0, 100);
  renderLog();
}
function renderLog() {
  const el = $('log'); if (!el) return;
  el.innerHTML = state.log.map(e => {
    if (e.info) return '<div class="log-entry info">' + e.t + ' - ' + e.msg + '</div>';
    return '<div class="log-entry ' + (e.ok ? 'ok' : 'bad') + '">' +
      e.t + ' - ' + (e.awb || '') + ' - ' + (e.city || '?') + ' - ' + (e.sortClass || 'X') +
      (e.extra ? ' - ' + e.extra : '') + '</div>';
  }).join('');
}

  const k = normalize(cityName);
  if (LOC_DB[k]) {
    const [name, sortClass, depot, agentie, judet] = LOC_DB[k];
    return { found: true, name, sortClass, depot, agentie, judet };
  }
  return { found: false };
}

async function lookupApi(awb) {
  const form = new FormData();
  form.append('username', state.opts.user);
  form.append('user_pass', state.opts.pass);
  form.append('client_id', state.opts.cid);
  form.append('standard', '4');
  form.append('awburi', JSON.stringify([awb]));

  const url = API_BASE + '/awb_tracking_list_integrat.php';
  let res;
  try { res = await fetch(url, { method: 'POST', body: form, mode: 'cors' }); }
  catch (e) { logInfo('FETCH FAIL: ' + e.message); return { ok: false, error: 'Retea/CORS: ' + e.message }; }
  if (!res.ok) { logInfo('HTTP ' + res.status); return { ok: false, error: 'HTTP ' + res.status }; }
  let data;
  try { data = await res.json(); }
  catch(e) {
    const txt = await res.text().catch(()=>'');
    logInfo('JSON parse fail: ' + txt.substring(0,100));
    return { ok: false, error: 'Raspuns invalid' };
  }
  if (!Array.isArray(data) || data.length === 0) return { ok: false, error: 'Raspuns gol' };
  const item = data[0];
  const city = item['oras destinatar'] || item['oras_destinatar'] || '';
  logInfo('API OK: ' + awb + ' -> ' + city);
  return { ok: true, city };
}

async function handleAwbScan(raw) {
  if (!raw || !raw.trim()) { showError('', 'Input gol'); return; }
  const awb = extractAwb(raw.trim());
  if (!awb) { showError(raw, 'AWB invalid (<13 cifre)'); return; }
  const now = Date.now();
  if (awb === state.lastAwb && (now - state.lastTime) < 1500) return;
  state.lastAwb = awb; state.lastTime = now;
  showWait(awb, 'Verific API...');
  const apiRes = await lookupApi(awb);
  if (!apiRes.ok) { showError(awb, apiRes.error); return; }
  const loc = lookupLocal(apiRes.city);
  if (!loc.found) { showResult(false, awb, apiRes.city, 'X', '', '', 'API'); return; }
  showResult(true, awb, loc.name, loc.sortClass, loc.agentie, loc.judet, 'API+DB');
}

function handleCityScan(raw) {
  if (!raw || !raw.trim()) { showError('', 'Input gol'); return; }
  const loc = lookupLocal(raw.trim());
  if (!loc.found) {
    const k = normalize(raw.trim());
    const matches = [];
    for (const key in LOC_DB) {
      if (key.includes(k) || k.includes(key)) {
        matches.push(LOC_DB[key]);
        if (matches.length >= 3) break;
      }
    }
    if (matches.length === 0) { showError(raw, 'Localitate necunoscuta'); return; }
    const m = matches[0];
    showResult(true, '', m[0], m[1], m[3], m[4], 'DB-fuzzy');
    return;
  }
  showResult(true, '', loc.name, loc.sortClass, loc.agentie, loc.judet, 'DB');
}

function doScan(raw) {
  ensureAudio();
  if (state.mode === 'awb') handleAwbScan(raw);
  else handleCityScan(raw);
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const val = input.value; input.value = '';
    hideAutocomplete();
    doScan(val);
  }
});
input.addEventListener('input', () => {
  if (state.mode === 'city') showAutocomplete(input.value);
  if (state.mode === 'awb' && input.value.length >= 13) {
    clearTimeout(window.__autoTimer);
    window.__autoTimer = setTimeout(() => {
      if (input.value.length >= 13 && state.mode === 'awb') {
        const val = input.value; input.value = '';
        doScan(val);
      }
    }, 150);
  }
});
$('btn-go').addEventListener('click', () => {
  const val = input.value; input.value = '';
  hideAutocomplete();
  doScan(val);
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.mode = btn.dataset.mode;
    input.value = ''; hideAutocomplete();
    if (state.mode === 'awb') {
      input.placeholder = 'AWB 13 cifre sau scan...';
      input.inputMode = 'numeric';
      $('label-hint').textContent = 'Mod: AWB + API - Tasteaza AWB (13 cifre) si apasa GO';
    } else {
      input.placeholder = 'Nume oras (ex: Bucuresti)...';
      input.inputMode = 'text';
      $('label-hint').textContent = 'Mod: ORAS (fara API) - Tasteaza oras pentru test rapid DB';
    }
    showIdle(); input.focus();
  });
});

const acList = $('ac-list');
function showAutocomplete(q) {
  if (state.mode !== 'city' || !q || q.length < 2) { hideAutocomplete(); return; }
  const k = normalize(q);
  const matches = [];
  for (const key in LOC_DB) {
    if (key.startsWith(k)) { matches.push(LOC_DB[key]); if (matches.length >= 8) break; }
  }
  if (matches.length < 8) {
    for (const key in LOC_DB) {
      if (!key.startsWith(k) && key.includes(k)) { matches.push(LOC_DB[key]); if (matches.length >= 8) break; }
    }
  }
  if (matches.length === 0) { hideAutocomplete(); return; }
  acList.innerHTML = matches.map((m, i) =>
    '<div class="ac-item" data-idx="' + i + '">' + m[0] +
    ' <span class="badge ' + m[1].toLowerCase() + '">' + m[1] + '</span>' +
    '<small>' + m[3] + ' - ' + m[4] + '</small></div>'
  ).join('');
  acList.classList.add('open');
  acList.querySelectorAll('.ac-item').forEach((el, i) => {
    el.addEventListener('click', () => {
      const m = matches[i];
      input.value = ''; hideAutocomplete();
      ensureAudio();
      showResult(true, '', m[0], m[1], m[3], m[4], 'DB');
    });
  });
}
function hideAutocomplete() { acList.classList.remove('open'); }

async function startCamera(deviceId) {
  ensureAudio();
  const camWrap = $('cam-wrap'), video = $('cam-video'), statusEl = $('cam-status');
  camWrap.classList.add('open');
  state.cam.active = true;

  if (window.__zxingFailed || !window.ZXingBrowser) {
    statusEl.textContent = 'EROARE: ZXing nu s-a incarcat. Verifica internetul.';
    logInfo('ZXing load FAIL'); return;
  }
  if (!window.isSecureContext) {
    statusEl.textContent = 'EROARE: Necesar HTTPS. Acum: ' + location.protocol;
    logInfo('Not secure: ' + location.protocol); return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    statusEl.textContent = 'EROARE: Browser fara suport camera'; return;
  }

  try {
    statusEl.textContent = 'Cer permisiune camera...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    stream.getTracks().forEach(t => t.stop());

    const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    state.cam.devices = devices;
    logInfo('Camere gasite: ' + devices.length);
    if (devices.length === 0) { statusEl.textContent = 'Nicio camera detectata'; return; }
    if (!deviceId) {
      const rear = devices.find(d => /back|rear|environment/i.test(d.label));
      deviceId = rear ? rear.deviceId : devices[devices.length - 1].deviceId;
    }
    state.cam.deviceId = deviceId;

    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    state.cam.reader = reader;
    statusEl.textContent = 'Pornesc camera...';
    const controls = await reader.decodeFromVideoDevice(deviceId, video, (result) => {
      if (result) {
        const text = result.getText();
        statusEl.textContent = 'Detectat: ' + text.substring(0, 30);
        onCameraScan(text);
      }
    });
    state.cam.controls = controls;
    setTimeout(() => {
      try { const s = video.srcObject; if (s) state.cam.track = s.getVideoTracks()[0]; } catch(e) {}
    }, 500);
    statusEl.textContent = 'Aliniaza barcode in cadru';
  } catch (e) {
    statusEl.textContent = 'Eroare: ' + (e.name || '') + ' ' + (e.message || '');
    logInfo('Camera err: ' + (e.name || '') + ' ' + (e.message || ''));
  }
}
function stopCamera() {
  if (state.cam.controls) { try { state.cam.controls.stop(); } catch(e){} }
  if (state.cam.track) { try { state.cam.track.stop(); } catch(e){} }
  state.cam.controls = null; state.cam.reader = null; state.cam.track = null;
  state.cam.active = false;
  $('cam-wrap').classList.remove('open');
}
async function onCameraScan(text) {
  if (state.mode === 'awb') {
    const awb = extractAwb(text);
    if (!awb) { $('cam-status').textContent = 'Cod invalid: ' + text.substring(0, 30); return; }
    const now = Date.now();
    if (awb === state.lastAwb && (now - state.lastTime) < 2000) return;
  }
  $('cam-status').textContent = 'OK: ' + text.substring(0, 30);
  vibrate(50);
  if (!state.opts.continuous) stopCamera();
  doScan(text);
}

$('btn-cam').addEventListener('click', () => { if (state.cam.active) stopCamera(); else startCamera(); });
$('btn-cam-close').addEventListener('click', stopCamera);
$('btn-cam-switch').addEventListener('click', async () => {
  if (state.cam.devices.length < 2) { $('cam-status').textContent = 'Doar o camera'; return; }
  const idx = state.cam.devices.findIndex(d => d.deviceId === state.cam.deviceId);
  const next = state.cam.devices[(idx + 1) % state.cam.devices.length];
  stopCamera(); setTimeout(() => startCamera(next.deviceId), 200);
});
$('btn-cam-torch').addEventListener('click', async () => {
  if (!state.cam.track) { $('cam-status').textContent = 'Flash indisponibil'; return; }
  const caps = state.cam.track.getCapabilities ? state.cam.track.getCapabilities() : {};
  if (!caps.torch) { $('cam-status').textContent = 'Flash nesuportat'; return; }
  try {
    state.cam.torch = !state.cam.torch;
    await state.cam.track.applyConstraints({ advanced: [{ torch: state.cam.torch }] });
    $('cam-status').textContent = state.cam.torch ? 'Flash ON' : 'Flash OFF';
  } catch (e) { $('cam-status').textContent = 'Flash err: ' + e.message; }
});

$('btn-settings').addEventListener('click', () => {
  $('panel').classList.add('open'); renderLog(); updateEnvInfo();
});
$('btn-close').addEventListener('click', () => $('panel').classList.remove('open'));

function updateEnvInfo() {
  const parts = [];
  parts.push('Host: ' + location.hostname);
  parts.push('Protocol: ' + location.protocol);
  parts.push('Secure: ' + (window.isSecureContext ? 'DA' : 'NU'));
  parts.push('Camera API: ' + (navigator.mediaDevices ? 'DA' : 'NU'));
  parts.push('ZXing: ' + (window.ZXingBrowser ? 'incarcat' : 'lipsa'));
  parts.push('API base: ' + API_BASE);
  parts.push('SW: ' + ('serviceWorker' in navigator ? 'suportat' : 'nu'));
  $('env-text').innerHTML = parts.join('<br>');
  const box = $('env-info');
  box.className = 'info-box';
  if (!window.isSecureContext) box.className = 'info-box bad';
  else if (!window.ZXingBrowser) box.className = 'info-box warn';
}

$('btn-test-camera').addEventListener('click', async () => {
  ensureAudio();
  logInfo('=== TEST CAMERA ===');
  logInfo('1. isSecureContext: ' + window.isSecureContext);
  logInfo('2. mediaDevices: ' + !!navigator.mediaDevices);
  logInfo('3. getUserMedia: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
  logInfo('4. ZXing global: ' + (typeof window.ZXingBrowser));
  logInfo('5. ZXing failed flag: ' + !!window.__zxingFailed);
  logInfo('6. window.ZXing: ' + (typeof window.ZXing));

  if (!window.isSecureContext) { logInfo('STOP: nu este HTTPS'); return; }
  if (!navigator.mediaDevices) { logInfo('STOP: mediaDevices lipsa'); return; }

  try {
    logInfo('7. Cer permission camera...');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    logInfo('8. Stream OK, tracks: ' + stream.getTracks().length);
    const track = stream.getVideoTracks()[0];
    if (track) {
      logInfo('9. Track label: ' + track.label);
      const settings = track.getSettings ? track.getSettings() : {};
      logInfo('10. Resolution: ' + settings.width + 'x' + settings.height);
    }
    stream.getTracks().forEach(t => t.stop());
    logInfo('=== Permission OK, camera functioneaza ===');

    if (window.ZXingBrowser) {
      logInfo('11. Listing devices...');
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      logInfo('12. Camere gasite: ' + devices.length);
      devices.forEach((d, i) => logInfo('  [' + i + '] ' + d.label));
    } else {
      logInfo('ATENTIE: ZXing nu e disponibil, folosesc Force Reload din actiuni.');
    }
  } catch (e) {
    logInfo('EROARE: ' + (e.name || '') + ' - ' + (e.message || ''));
  }
});

$('btn-test-api').addEventListener('click', async () => {
  ensureAudio();
  logInfo('=== TEST API ===');
  showWait('7000107832041', 'Testez API...');
  const res = await lookupApi('7000107832041');
  if (res.ok) {
    logInfo('TEST OK: oras = ' + res.city);
    const loc = lookupLocal(res.city);
    if (loc.found) showResult(true, '7000107832041', loc.name, loc.sortClass, loc.agentie, loc.judet, 'TEST');
    else showResult(false, '7000107832041', res.city, 'X', '', '', 'TEST');
  } else {
    logInfo('TEST FAIL: ' + res.error);
    showError('7000107832041', 'API: ' + res.error);
  }
});

function bindOpt(id, key, type) {
  const el = $(id); if (!el) return;
  type = type || 'checkbox';
  if (type === 'checkbox') {
    el.checked = state.opts[key];
    el.addEventListener('change', () => { state.opts[key] = el.checked; saveState(); });
  } else {
    el.value = state.opts[key];
    el.addEventListener('change', () => { state.opts[key] = el.value; saveState(); });
  }
}
bindOpt('opt-sound', 'sound');
bindOpt('opt-vibrate', 'vibrate');
bindOpt('opt-continuous', 'continuous');
bindOpt('opt-r1', 'r1');
bindOpt('opt-r2', 'r2');
bindOpt('opt-r3', 'r3');
bindOpt('opt-user', 'user', 'text');
bindOpt('opt-pass', 'pass', 'text');
bindOpt('opt-cid', 'cid', 'text');

$('btn-reset-stats').addEventListener('click', () => {
  if (confirm('Reset OK/NU?')) { state.ok = state.bad = state.total = 0; updateCounters(); saveState(); }
});
$('btn-clear-all').addEventListener('click', () => {
  if (confirm('STERGE TOT?')) {
    state.ok = state.bad = state.total = 0; state.log = [];
    updateCounters(); renderLog(); saveState();
  }
});
$('btn-force-reload').addEventListener('click', async () => {
  if (!confirm('Curat tot cache-ul si fortez reload? (rezolva probleme dupa update)')) return;
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch(e) {}
  location.reload(true);
});

$('btn-export').addEventListener('click', () => {
  const rows = [['timestamp','awb','city','sort_class','status','extra']];
  state.log.forEach(e => {
    if (e.info) return;
    rows.push([e.t, e.awb, e.city, e.sortClass, e.ok?'OK':'NU', e.extra || '']);
  });
  const csv = rows.map(r => r.map(c => '"' + (c||'').toString().replace(/"/g,'""') + '"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fan_scan_log_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.csv';
  a.click();
});

function saveState() {
  try {
    localStorage.setItem('fan_sort_state', JSON.stringify({
      opts: state.opts, ok: state.ok, bad: state.bad, total: state.total, log: state.log
    }));
  } catch(e) {}
}
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('fan_sort_state'));
    if (s) {
      Object.assign(state.opts, s.opts || {});
      state.ok = s.ok || 0; state.bad = s.bad || 0; state.total = s.total || 0;
      state.log = s.log || [];
    }
  } catch(e) {}
}

// Register service worker for PWA / offline
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg failed:', err));
  });
}

loadState();
updateCounters();
$('db-count').textContent = Object.keys(LOC_DB).length;
showIdle();
input.focus();
</script>
