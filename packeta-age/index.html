<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#BA1B02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packeta Age">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Packeta Age</title>
<style>
:root{--brand:#BA1B02;--brand-d:#8F1500;--ink:#16181D;--mute:#6B7280;--soft:#A1A1AA;--line:#E7E5E4;--bg:#F4F2EF;--card:#fff;
  --g:#16A34A;--g-d:#0F7A35;--g-bg:#E8F7EE;--r:#DC2626;--r-d:#B42318;--r-bg:#FDECEC;--n:#71717A;--n-bg:#EFEEEC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:6;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
.top .logo{display:flex;align-items:center}.top .logo svg{height:24px;width:auto;display:block}
.tag{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:999px}
.sp{flex:1}
.ibtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.ibtn.on{background:#fff;color:var(--brand)}
.cam{position:relative;height:min(40vh,340px);background:#0E0E10;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.win{position:absolute;left:7%;right:7%;top:20%;bottom:20%;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:box-shadow .2s,outline-color .2s;outline:3px solid transparent}
.win.g{box-shadow:0 0 0 999px rgba(22,163,74,.40);outline-color:var(--g)}
.win.r{box-shadow:0 0 0 999px rgba(220,38,38,.40);outline-color:var(--r)}
.win.n{box-shadow:0 0 0 999px rgba(80,80,80,.5);outline-color:#bbb}
.win i{position:absolute;width:28px;height:28px;border:4px solid #fff}
.win i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.win i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.win i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.win i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.laser{position:absolute;left:5%;right:5%;height:2px;top:50%;background:#FF4D3A;box-shadow:0 0 12px 2px rgba(255,77,58,.8);animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;transition:all .18s;padding:10px 22px;border-radius:18px;color:#fff;font-weight:800;font-size:34px;letter-spacing:-.5px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}
.badge.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.badge.g{background:var(--g)}.badge.r{background:var(--r)}.badge.n{background:#52525B;font-size:20px}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 16px}
.blocked{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px;background:#0E0E10}
.blocked.show{display:flex}
.blocked button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:10px 18px;font-weight:700}
main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.res{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.07)}
.band{padding:14px 16px 16px;color:#fff;position:relative}
.res.g .band{background:linear-gradient(135deg,#16A34A,#12893D)}
.res.r .band{background:linear-gradient(135deg,#DC2626,#B91C1C)}
.res.n .band{background:linear-gradient(135deg,#71717A,#52525B)}
.band .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;opacity:.95}
.band .st{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.ageblk{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.ageblk .num{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.ageblk .unit{font-size:20px;font-weight:700}
.verdict{margin-top:4px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.verdict:before{content:"";width:10px;height:10px;border-radius:50%;background:#fff;opacity:.9}
.body{padding:14px 16px 12px}
.code{font-weight:800;font-size:17px;letter-spacing:.4px}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}
.facts div{min-width:0}
.facts label{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.facts b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts small{display:block;color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{color:var(--brand);font-weight:700;font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary:after{content:" +"}details[open] summary:after{content:" -"}
.tl{list-style:none;margin:10px 0 0;padding:0}
.tl li{position:relative;padding:0 0 12px 18px;font-size:13px}
.tl li:before{content:"";position:absolute;left:4px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--soft)}
.tl li:first-child:before{background:var(--brand)}
.tl li:after{content:"";position:absolute;left:7px;top:15px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl time{display:block;color:var(--mute);font-size:12px}
.idle{background:var(--card);border-radius:18px;padding:18px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 28px rgba(0,0,0,.07)}
.idle .mk{width:52px;height:52px;border-radius:14px;background:var(--brand);display:grid;place-items:center;flex:none}
.idle .mk svg{width:28px;height:30px}
.idle b{font-size:18px;display:block}.idle span{color:var(--mute);font-size:13px}
.legend{display:flex;gap:10px;margin-top:6px;font-size:12px;font-weight:700}
.legend .lg{color:var(--g-d)}.legend .lr{color:var(--r-d)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);background-size:200% 100%;animation:sh 1s linear infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}
.loadband{height:118px;background:linear-gradient(90deg,#e9e7e4,#f3f1ee,#e9e7e4);background-size:200% 100%;animation:sh 1s linear infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{border-radius:14px;padding:10px 12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.stat.g b,.stat.g span{color:var(--g-d)}.stat.r b,.stat.r span{color:var(--r-d)}.stat.n b,.stat.n span{color:var(--n)}
.stat.g{background:var(--g-bg)}.stat.r{background:var(--r-bg)}.stat.n{background:var(--n-bg)}
form{display:flex;gap:8px;margin:0 0 12px}
form input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;background:#fff}
form button{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:0 18px;font-weight:700}
.hh{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 6px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.hh button{background:none;border:0;color:var(--brand);font-weight:700;font-size:12px;text-transform:uppercase}
.list{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.list:empty{display:none}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 12px;border-top:1px solid var(--line);border-left:5px solid var(--soft)}
.row:first-child{border-top:0}
.row.g{border-left-color:var(--g)}.row.r{border-left-color:var(--r)}.row.n{border-left-color:var(--soft)}
.row .c{flex:1;min-width:0}
.row .c b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.chip.g{background:var(--g-bg);color:var(--g-d)}.chip.r{background:var(--r-bg);color:var(--r-d)}.chip.n{background:var(--n-bg);color:var(--n)}
.gate{position:fixed;inset:0;z-index:20;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.gate[hidden]{display:none}
.gate .glogo svg{height:40px;width:auto}
.gcard{background:#fff;border-radius:20px;padding:24px 22px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.gcard h2{margin:0;font-size:20px}.gcard p{margin:4px 0 16px;color:var(--mute)}
.gcard input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;text-align:center}
.gerr{color:var(--r-d);font-size:13px;min-height:20px;margin:8px 0}
.gcard button{width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px}
</style>
</head>
<body>
<header class="top">

  <button id="torch" class="ibtn" hidden aria-label="Light"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10v4l-3 5v11h-4V11L7 6z"/></svg></button>
  <button id="snd" class="ibtn" aria-label="Sound"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path id="sndp" d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
</header>
<section class="cam">
  <video id="v" playsinline muted autoplay></video>
  <div class="win" id="win"><i></i><i></i><i></i><i></i><div class="laser"></div></div>
  <div class="badge" id="badge"></div>
  <div class="hint" id="hint">Point at any barcode on the label</div>
  <div class="blocked" id="blocked"><div id="blockedTxt">Camera is off</div><button id="retry">Turn camera on</button></div>
</section>
<main>
  <div id="card"><div class="idle"><div class="mk"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 40"><path fill="#fff" d="m19.4 16.1-.9.4-.9-.4-13-6.5 6.2-2.4 13.4 6.5zm13.1-6.5-4.7 2.3-13.5-6 4.2-1.6z"/><path fill="#fff" d="m19 0 17.2 6.6-2.4 1.9-15.2-6L3.2 8.6l-2.4-2L18 0zm15.1 9.1L36.9 8l-2.1 17.6-.4.8-15 13.6-.5-3.1 13.4-12zM2.5 26.5l-.4-.8L0 8.1l2.8 1.1 1.9 15.7 13.4 12-.5 3.1z"/><path fill="#B4B4B4" d="m28.2 12.4 4.3-2.7-1.7 14.2L18.6 35l.6-17 5.4-3.3-.3 8.3 3.3-2.3z"/><path fill="#DEDEDE" d="m17.7 17.9.6 17-12.2-11L4.4 9.8z"/></svg></div><div><b>Scan a parcel</b><span>Any barcode Packeta tracking knows</span>
    <div class="legend"><span class="lg">Green: under 24 h</span><span class="lr">Red: 24 h or older</span></div></div></div></div>
  <div class="stats"><div class="stat g"><b id="sg">0</b><span>Under 24 h</span></div><div class="stat r"><b id="sr">0</b><span>24 h +</span></div><div class="stat n"><b id="sn">0</b><span>Not found</span></div></div>
  <form id="manual"><input id="mi" autocomplete="off" autocapitalize="characters" placeholder="Type a barcode or tracking number"><button type="submit">Check</button></form>
  <div class="hh"><span id="hc">Scanned</span><button id="clear" hidden>Clear</button></div>
  <div class="list" id="list"></div>
</main>
<div class="gate" id="gate" hidden>

  <form class="gcard" id="gform"><h2>Packeta Age</h2><p>Enter the team PIN</p>
    <input id="gpin" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="PIN">

<script src="zxing.min.js"></script>
<script>
(function () {
var $ = function (s) { return document.querySelector(s); };
// In the Android app the lookup is answered by the app; on the web by the Supabase helper (team PIN).
var RELAY_BASE = 'https://riacmlgvmabbobqjgzjo.supabase.co/functions/v1/packeta-track';
var RELAY = RELAY_BASE + '?id=';
var API = new URLSearchParams(location.search).get('api') || (location.hostname === 'packeta-age.local' ? '/api/' : RELAY);
var LIMIT_H = 24;                                   // red from 24 hours of age, green below
var busy = false, stream = null, reader = null, timer = null, cache = {}, seen = {}, torchOn = false;
var NEEDS_PIN = (API === RELAY), PIN_KEY = 'packeta-age-pin', memPin = '';
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
function getPin() { return store(PIN_KEY) || memPin; }
function setPin(p) { memPin = p; store(PIN_KEY, p); }
function clearPin() { memPin = ''; store(PIN_KEY, null); }
function hdrs() { return NEEDS_PIN ? {'x-pin': getPin()} : {}; }

function clean(raw) { return String(raw).replace(/[^0-9A-Za-z]/g, '').toUpperCase(); }
function fmtCode(b) { var s = String(b).replace(/^Z/i, ''); return /^\d{10}$/.test(s) ? 'Z ' + s.slice(0, 3) + ' ' + s.slice(3, 7) + ' ' + s.slice(7) : String(b); }
function strip(h) { return String(h || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim(); }
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

// Packeta times are Prague wall time
function pragueOffset(ts) {
  var p = new Intl.DateTimeFormat('en-US', {timeZone: 'Europe/Prague', hourCycle: 'h23', year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'}).formatToParts(new Date(ts));
  var g = function (k) { for (var i = 0; i < p.length; i++) if (p[i].type === k) return +p[i].value; return 0; };
  return Date.UTC(g('year'), g('month') - 1, g('day'), g('hour'), g('minute'), g('second')) - ts;
}
function pt(s) {
  var p = String(s).match(/(\d+)-(\d+)-(\d+) (\d+):(\d+):(\d+)/);
  if (!p) return null;
  var wall = Date.UTC(+p[1], +p[2] - 1, +p[3], +p[4], +p[5], +p[6]);
  var t = wall - pragueOffset(wall); t = wall - pragueOffset(t);
  return {t: t, d: p[3] + '.' + p[2] + '.' + p[1], hm: p[4] + ':' + p[5]};
}
function age(ms) {
  var mins = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(mins / 60);
  var c = h >= LIMIT_H ? 'r' : 'g';
  if (h < 1) return {num: mins, unit: 'min', short: mins + ' min', c: c, h: h};
  if (h < 24) return {num: h, unit: h === 1 ? 'hour' : 'hours', short: h + ' h', c: c, h: h};
  var d = Math.floor(h / 24);
  return {num: d, unit: d === 1 ? 'day' : 'days', short: d + (d === 1 ? ' day' : ' days'), c: c, h: h};
}
function status(txt) {
  var s = String(txt || '').toLowerCase();
  if (/return|back to|sent back/.test(s)) return /returned|delivered back/.test(s) ? 'Returned' : 'Return';
  if (/cancel/.test(s)) return 'Cancelled';
  if (/has been delivered|was delivered|is with you|picked up|collected/.test(s)) return 'Delivered';
  if (/ready|pick up|pick-up|stored/.test(s)) return 'Ready for pickup';
  if (/aware|waiting for the sender/.test(s)) return 'Not handed over';
  return 'On the way';
}

// Sound: short MP3s (HTML audio is what plays reliably on iPhone home-screen apps), unlocked on first touch
var snd = {g: $('#s_g'), r: $('#s_r'), n: $('#s_n')}, soundOn = store('packeta-age-sound') !== 'off', unlocked = false;
function unlock() {
  if (unlocked) return; unlocked = true;
  Object.keys(snd).forEach(function (k) { var a = snd[k]; a.muted = true; var p = a.play(); if (p && p.then) p.then(function () { a.pause(); a.currentTime = 0; a.muted = false; }).catch(function () { a.muted = false; }); else a.muted = false; });
}
['touchend', 'click', 'keydown'].forEach(function (ev) { document.addEventListener(ev, unlock, {once: true, capture: true}); });
function setSoundIcon() { $('#snd').classList.toggle('on', !soundOn); $('#snd').style.opacity = soundOn ? '1' : '.6'; }
$('#snd').addEventListener('click', function () { soundOn = !soundOn; store('packeta-age-sound', soundOn ? 'on' : 'off'); setSoundIcon(); if (soundOn) play('g'); });
setSoundIcon();
function play(c) {
  if (soundOn) { try { var a = snd[c]; a.currentTime = 0; var p = a.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  try { navigator.vibrate(c === 'g' ? 60 : c === 'r' ? [220, 90, 220] : [60, 60, 60, 60, 60]); } catch (e) {}
}
var badgeT = null;
function showBadge(c, text) {
  var b = $('#badge'), w = $('#win');
  b.className = 'badge ' + c + ' show'; b.textContent = text; w.className = 'win ' + c;
  clearTimeout(badgeT); badgeT = setTimeout(function () { b.className = 'badge'; w.className = 'win'; }, 1600);
}

function render(key) {
  var r = cache[key], card = $('#card');
  card.innerHTML = '';
  var res = el('div', 'res ' + (r.err ? 'n' : r.age.c)), band = el('div', 'band'), top2 = el('div', 'top2');
  if (r.err) {
    top2.appendChild(el('span', null, r.label));
    band.appendChild(top2);
    var ab = el('div', 'ageblk'); ab.appendChild(el('span', 'unit', r.err)); band.appendChild(ab);
    band.appendChild(el('div', 'verdict', 'Check the barcode and scan again'));
    res.appendChild(band); card.appendChild(res); return;
  }
  top2.appendChild(el('span', null, 'Created ' + r.created.d + ' ' + r.created.hm));
  top2.appendChild(el('span', 'st', r.st));
  band.appendChild(top2);
  var a = el('div', 'ageblk'); a.appendChild(el('span', 'num', String(r.age.num))); a.appendChild(el('span', 'unit', r.age.unit)); band.appendChild(a);
  band.appendChild(el('div', 'verdict', r.age.c === 'r' ? '24 hours or older' : 'Under 24 hours'));
  res.appendChild(band);
  var body = el('div', 'body');
  body.appendChild(el('div', 'code', r.label));
  if (r.scanned !== clean(r.barcode) && r.scanned !== 'Z' + clean(r.barcode)) body.appendChild(el('div', 'sub', 'Scanned ' + r.scanned));
  var f = el('div', 'facts');
  var fact = function (label, main, small) { var d = el('div'); d.appendChild(el('label', null, label)); d.appendChild(el('b', null, main || 'n/a')); if (small) d.appendChild(el('small', null, small)); f.appendChild(d); };
  fact('Received by Packeta', r.recv ? r.recv.d : 'not yet', r.recv ? r.recv.hm + (r.recvAt ? ' · ' + r.recvAt : '') : '');
  fact('Last update', r.last ? r.last.p.d : 'n/a', r.last ? r.last.p.hm : '');
  fact('Sender', r.sender);
  fact('Delivery to', r.dest);
  body.appendChild(f);
  var det = el('details'); det.appendChild(el('summary', null, 'All events (' + r.events.length + ')'));
  var ol = el('ol', 'tl');
  r.events.slice().reverse().forEach(function (e) { var li = el('li'); li.appendChild(el('time', null, e.when)); li.appendChild(document.createTextNode(e.text)); ol.appendChild(li); });
  det.appendChild(ol); body.appendChild(det);
  res.appendChild(body); card.appendChild(res);
}
function loading(label) {
  var card = $('#card'); card.innerHTML = '';
  var res = el('div', 'res'); res.appendChild(el('div', 'loadband'));
  var body = el('div', 'body'); body.appendChild(el('div', 'code', label)); body.appendChild(el('div', 'sk')); body.appendChild(el('div', 'sk'));
  res.appendChild(body); card.appendChild(res);
}
function counts() {
  var rows = $('#list').children, g = 0, r = 0, n = 0;
  for (var i = 0; i < rows.length; i++) { var c = rows[i].getAttribute('data-c'); if (c === 'g') g++; else if (c === 'r') r++; else n++; }
  $('#sg').textContent = g; $('#sr').textContent = r; $('#sn').textContent = n;
  $('#hc').textContent = rows.length ? 'Scanned (' + rows.length + ')' : 'Scanned'; $('#clear').hidden = !rows.length;
}
function addRow(key) {
  var r = cache[key], list = $('#list'), c = r.err ? 'n' : r.age.c;
  var rk = r.err ? key : 'P' + clean(r.barcode);          // one row per parcel, whatever barcode was scanned
  var old = list.querySelector('[data-k="' + rk + '"]'); if (old) list.removeChild(old);
  var row = el('div', 'row ' + c); row.setAttribute('data-k', rk); row.setAttribute('data-c', c);
  var mid = el('div', 'c'); mid.appendChild(el('b', null, r.label));
  mid.appendChild(el('small', null, r.err ? r.err : r.st + ' · created ' + r.created.d));
  row.appendChild(mid); row.appendChild(el('span', 'chip ' + c, r.err ? 'n/a' : r.age.short));
  row.addEventListener('click', function () { render(key); window.scrollTo({top: 0, behavior: 'smooth'}); });
  list.insertBefore(row, list.firstChild);
  counts();
}

function lookup(raw) {
  var key = clean(raw);
  if (key.length < 6) { cache[key] = {err: 'Barcode too short', label: String(raw)}; render(key); play('n'); showBadge('n', 'Too short'); return Promise.resolve(); }
  var label = fmtCode(key), locked = false;
  loading(label);
  return fetch(API + encodeURIComponent(key), {cache: 'no-store', headers: hdrs()}).then(function (res) {
    if (res.status === 401) { locked = true; clearPin(); showGate('Wrong or changed PIN. Enter the team PIN.'); return; }
    if (res.status === 404) { cache[key] = {err: 'Not found', label: label}; return; }
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json().then(function (j) {
      var it = j.item || {}, td = it.trackingDetails || [];
      var ev = td.map(function (e) { var p = pt(e.time); return {p: p, text: strip(e.text), when: p ? p.d + ' ' + p.hm : e.time}; })
        .filter(function (e) { return e.p; }).sort(function (a, b) { return a.p.t - b.p.t; });
      if (!ev.length) { cache[key] = {err: 'No Packeta events yet', label: fmtCode(it.barcode || key)}; return; }
      var recv = null, recvAt = '';
      for (var i = 0; i < ev.length; i++) {
        var m = ev[i].text.match(/received the parcel for transport\.?\s*(.*)$/i);
        if (m) { recv = ev[i].p; recvAt = m[1] || ''; break; }
      }
      cache[key] = {
        label: fmtCode(it.barcode || key), barcode: it.barcode || key, scanned: key,
        age: age(Date.now() - ev[0].p.t), created: ev[0].p, recv: recv, recvAt: recvAt, last: ev[ev.length - 1],
        st: status(it.packetStatus), sender: strip(it.sender).replace(/_+$/, ''), dest: strip(it.branchAddress), events: ev
      };
    });
  }).catch(function () { cache[key] = {err: 'No connection', label: label}; })
    .then(function () {
      if (locked) return;
      var r = cache[key], c = r.err ? 'n' : r.age.c;
      render(key); addRow(key); play(c); showBadge(c, r.err ? r.err : r.age.short);
    });
}

// A barcode that stays in front of the camera is checked once, again only after 8 s out of view
function onCode(text, typed) {
  if (busy) return;
  var key = clean(text), now = Date.now(), prev = seen[key];
  seen[key] = now;
  if (!typed && prev && now - prev < 8000) return;
  busy = true;
  lookup(text).then(function () { busy = false; }, function () { busy = false; });
}

var VIDEO = {facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720}};
var FORMATS = ['CODE_128', 'CODE_39', 'CODE_93', 'ITF', 'EAN_13', 'EAN_8', 'UPC_A', 'CODABAR', 'QR_CODE', 'DATA_MATRIX', 'PDF_417'];
function stop() {
  if (timer) { clearTimeout(timer); timer = null; }
  if (reader) { try { reader.reset(); } catch (e) {} reader = null; }
  var s = stream || ($('#v').srcObject); if (s) s.getTracks().forEach(function (t) { t.stop(); });
  stream = null; $('#v').srcObject = null; torchOn = false; $('#torch').hidden = true;
}
function setupTorch() {
  var s = $('#v').srcObject, t = s && s.getVideoTracks && s.getVideoTracks()[0];
  var caps = t && t.getCapabilities ? t.getCapabilities() : {};
  if (!caps.torch) return;
  var b = $('#torch'); b.hidden = false; b.classList.toggle('on', torchOn);
  b.onclick = function () { torchOn = !torchOn; t.applyConstraints({advanced: [{torch: torchOn}]}).catch(function () {}); b.classList.toggle('on', torchOn); };
}
function start() {
  stop(); $('#blocked').classList.remove('show');
  var v = $('#v');
  var useZxing = function () {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, FORMATS.map(function (f) { return ZXing.BarcodeFormat[f]; }));
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    reader = new ZXing.BrowserMultiFormatReader(hints, 120);
    return reader.decodeFromConstraints({video: VIDEO}, v, function (res) { if (res) onCode(res.getText()); }).then(setupTorch);
  };
  var nat = ('BarcodeDetector' in window) ? BarcodeDetector.getSupportedFormats().catch(function () { return []; }) : Promise.resolve([]);
  nat.then(function (fm) {
    var want = ['code_128', 'code_39', 'code_93', 'itf', 'ean_13', 'ean_8', 'upc_a', 'codabar', 'qr_code', 'data_matrix', 'pdf417'].filter(function (f) { return fm.indexOf(f) >= 0; });
    if (want.indexOf('code_128') < 0) return useZxing();
    var det = new BarcodeDetector({formats: want}), fails = 0;
    return navigator.mediaDevices.getUserMedia({video: VIDEO}).then(function (st) { stream = st; v.srcObject = st; return v.play(); }).then(function () {
      setupTorch();
      var loop = function () {
        det.detect(v).then(function (b) { fails = 0; if (b.length) onCode(b[0].rawValue); }).catch(function () { fails++; })
          .then(function () { if (!stream) return; if (fails > 20) { stop(); useZxing().catch(onCamErr); return; } timer = setTimeout(loop, 110); });
      };
      loop();
    });
  }).catch(onCamErr);
}
function onCamErr(e) {
  $('#blockedTxt').textContent = (e && e.name === 'NotAllowedError')
    ? 'Camera access is blocked. Allow the camera for this app in the phone settings, then tap below.'
    : 'Camera could not start. You can still type a barcode below.';
  $('#blocked').classList.add('show');
}
function showGate(msg) {
  stop(); $('#gate').hidden = false; $('#gerr').textContent = msg || ''; $('#gpin').value = '';
  setTimeout(function () { try { $('#gpin').focus(); } catch (e) {} }, 50);
}
$('#gform').addEventListener('submit', function (e) {
  e.preventDefault();
  var p = $('#gpin').value.trim(); if (!p) return;
  $('#gerr').textContent = 'Checking...';
  fetch(RELAY_BASE + '?ping=1', {cache: 'no-store', headers: {'x-pin': p}}).then(function (r) {
    if (r.ok) { setPin(p); $('#gate').hidden = true; $('#gerr').textContent = ''; $('#gpin').blur(); start(); }
    else if (r.status === 401) { $('#gerr').textContent = 'Wrong PIN'; }
    else { $('#gerr').textContent = 'Could not check the PIN. Try again.'; }
  }).catch(function () { $('#gerr').textContent = 'No internet connection'; });
});
$('#retry').addEventListener('click', start);
document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else if ($('#gate').hidden) start(); });
$('#manual').addEventListener('submit', function (e) {
  e.preventDefault(); var t = $('#mi').value; $('#mi').value = ''; $('#mi').blur(); if (t.trim()) onCode(t, true);
});
$('#clear').addEventListener('click', function () { $('#list').innerHTML = ''; seen = {}; counts(); });
if (NEEDS_PIN && !getPin()) showGate(''); else start();
})();
</script>
